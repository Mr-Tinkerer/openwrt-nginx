server {
    #port and domain name
    listen 80;
    server_name omv.uhhhhh;

    #log the access and error for this site
    access_log /var/log/nginx/omv-access.log;
    error_log /var/log/nginx/omv-error.log;

    location / {
        #redirect to the new server
        proxy_pass http://10.10.0.13:80;
        
        #pass the request headers for the host name and ip
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        #websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        #keep the orginal ip address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #keep the orginal http or https request
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
